# Site estático: não há etapa de build, publica a raiz do repositório.
[build]
  publish = "."

# Não expor os scripts SQL e arquivos internos do repositório.
[[redirects]]
  from = "/database/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
